# The GitHub release of a version of @tinyactors/node and @tinyactors/wasm.
#
# This file lives in the monorepo's tinyactors-napi/ and reaches the release
# repository, tinyactors-dev/tinyactors-napi, with each release's snapshot of
# that directory; GitHub runs it there (a workflow below a repository's root
# does nothing in the monorepo). A cloud session's git proxy pushes branches
# but not tags, so the release pushes the snapshot to main and this makes
# the rest, with the workflow's own token: the tag v<version> on the
# snapshot and its GitHub release. It writes nothing of its own. The notes
# are RELEASE_NOTES.md, which the release committed; the files are the
# packages npm serves for the version, the same bytes the release built
# (its builds are reproducible), with their SHA256SUMS.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release the snapshot's version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          title=$(head -n 1 RELEASE_NOTES.md | sed 's/^# //')
          case "$title" in
            *" $version") ;;
            *) echo "::error::RELEASE_NOTES.md is not $version's (its title: $title)"; exit 1 ;;
          esac
          name=$(node -p "require('./package.json').name")
          # A staged publish is public once the maintainer approves it, so
          # wait for npm to serve every package, up to two hours. The
          # platform packages are the published package's optionalDependencies
          # (the packed package.json lists them; this directory's does not).
          for attempt in $(seq 1 60); do
            platforms=$(npm view "$name@$version" optionalDependencies --json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(Object.keys(JSON.parse(s)).join(' '))}catch{}})")
            missing=""
            [ -n "$platforms" ] || missing=" $name"
            for package in $name $platforms @tinyactors/wasm; do
              npm view "$package@$version" version >/dev/null 2>&1 || missing="$missing $package"
            done
            [ -z "$missing" ] && break
            echo "npm does not serve$missing at $version yet; waiting"
            sleep 120
          done
          if [ -n "$missing" ]; then
            echo "::error::npm does not serve$missing at $version"
            exit 1
          fi
          mkdir -p dist
          (cd dist && for package in $name $platforms @tinyactors/wasm; do npm pack "$package@$version" --silent; done && sha256sum *.tgz > SHA256SUMS)
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file RELEASE_NOTES.md dist/*
            exit 0
          fi
          # A release made already (by an earlier run) gets the files it lacks;
          # its notes and its files' bytes stay as they are.
          have=$(gh release view "$tag" --json assets --jq '.assets[].name')
          for file in dist/*; do
            echo "$have" | grep -qx "$(basename "$file")" || gh release upload "$tag" "$file"
          done
          if ! echo "$have" | grep -qx SHA256SUMS || [ "$(gh release download "$tag" -p SHA256SUMS -O - | sha256sum)" != "$(sha256sum < dist/SHA256SUMS)" ]; then
            gh release upload "$tag" dist/SHA256SUMS --clobber
          fi
